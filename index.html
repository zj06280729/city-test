.hide{display:none !important;}

.progress-bar{width:100%;height:6px;background:#D9E0E5;border-radius:999px;margin-bottom:24px;overflow:hidden;}
.progress-inner{height:100%;background:#8B9AA8;transition:0.3s;width:6.67%;}
.question{font-size:17px;color:#3A3A48;margin-bottom:20px;}
.opt{padding:14px;border:1px solid #ddd;border-radius:14px;margin-bottom:12px;cursor:pointer;transition:0.2s;}
.opt.active{border-color:#8B9AA8;background:#F0F5F9;}
.tip{text-align:center;font-size:12px;opacity:0.6;margin-top:12px;}
.res-name{text-align:center;font-size:28px;font-weight:bold;color:#3A3A48;margin:8px 0;}
.res-tag{text-align:center;font-size:13px;opacity:0.8;margin-bottom:20px;}
.res-block{margin-bottom:16px;}
.res-block h4{color:#3A3A48;margin-bottom:6px;font-size:15px;}
.res-block p{font-size:14.5px;line-height:1.6;}
</style>
</head>

</div>
</div>

const short = document.getElementById("short");
const startBtn = document.getElementById("startBtn");
const nextBtn = document.getElementById("nextBtn");
const restartBtn = document.getElementById("restartBtn");

startBtn.onclick = function(){
    cover.classList.add("hide");
    quiz.classList.remove("hide");
    renderQ();
}
restartBtn.onclick = function(){
    current = 0;
    score = [0,0,0,0,0];
    result.classList.add("hide");
    cover.classList.remove("hide");
}
nextBtn.onclick = function(){
    current++;
    if(current >= qList.length){
        showResult();
    }else{
        renderQ();
    }
}
function renderQ(){
    const q = qList[current];
    qTitle.innerText = q.title;
    optBox.innerHTML = "";
    nextBtn.disabled = true;
    let sel = null;
    q.opts.forEach(item=>{
        const div = document.createElement("div");
        div.className = "opt";
        div.innerText = item.txt;
        div.onclick = function(){
            document.querySelectorAll(".opt").forEach(d=>d.classList.remove("active"));
            div.classList.add("active");
            sel = item;
            nextBtn.disabled = false;
        }
        optBox.appendChild(div);
    })
    const pct = ((current+1)/qList.length)*100;
    progressText.innerText = (current+1)+"/"+qList.length;
    progressInner.style.width = pct+"%";
    nextBtn.onclick = ()=>{
        if(!sel) return;
        for(let i=0;i<5;i++) score[i] += sel.score[i];
        current++;
        if(current >= qList.length){
            showResult();
        }else{
            renderQ();
        }
    }
}
function showResult(){
    quiz.classList.add("hide");
    result.classList.remove("hide");
    let maxI=0,maxV=score[0];
    for(let i=1;i<score.length;i++){
        if(score[i]>maxV){maxV=score[i];maxI=i;}
    }
    const r = cityData[maxI % cityData.length];
    cityName.innerText = r.name;
    cityTag.innerText = r.tag;
    adv.innerText = r.adv;
    suit.innerText = r.suit;
    short.innerText = r.short;
}
</script>
</body>
</html>
